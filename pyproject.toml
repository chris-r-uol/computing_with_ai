[project]
name = "cwai"
version = "0.1.0"
description = "Computing with AI: teaching material and support package"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cwai"]

[dependency-groups]
core = [
    "pandas",
    "pyarrow",
    "matplotlib",
    "geopandas",
    "pyogrio",
    "networkx",
]
# Multi-gigabyte; kept separate so CI jobs can install core and dev only.
dl = [
    "torch",
    "tensorflow",
]
dev = [
    "pytest",
    "ruff",
    "nbclient",
    "nbformat",
    "jsonschema",
    "quarto-cli==1.11.9",
    "actionlint-py",
]
