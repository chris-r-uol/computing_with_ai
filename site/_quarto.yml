project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "notebooks/**/*.ipynb"
  # Not referenced from a page, so Quarto would not publish them unasked.
  resources:
    - /vendor/*
  # Quarto loads jquery and requirejs from cdn.jsdelivr.net on any notebook page
  # with an HTML output, and has no setting to stop it. This points those pages
  # at the copies in vendor/ instead; see scripts/selfhost_assets.py.
  post-render: ../scripts/selfhost_assets.py

# Every page declares its language (WCAG 3.1.1).
lang: en

# Do not re-run every notebook on every render; re-execute only what changed.
execute:
  enabled: true
  freeze: auto

website:
  title: "Computing with AI"
  description: "Python, AI-accelerated coding and machine learning for transport"
  page-navigation: true
  bread-crumbs: true
  sidebar:
    style: docked
    search: true
    contents:
      - text: "Start here"
        href: index.qmd
      - section: "Stage 0: Warm-up"
        href: notebooks/00-warmup/index.qmd
        contents: notebooks/00-warmup/*
      - section: "Stage 1: Programming from first principles"
        href: notebooks/01-foundations/index.qmd
        contents: notebooks/01-foundations/*
      - section: "Stage 2: AI-accelerated and agentic workflows"
        href: notebooks/02-ai-accelerated/index.qmd
        contents: notebooks/02-ai-accelerated/*
      - section: "Stage 3: Direct machine learning"
        href: notebooks/03-machine-learning/index.qmd
        contents: notebooks/03-machine-learning/*
      - section: "Stage 4: Project"
        href: notebooks/04-project/index.qmd
        contents: notebooks/04-project/*
      - section: "Stretch"
        href: notebooks/90-stretch/index.qmd
        contents: notebooks/90-stretch/*
      - section: "Reference"
        contents:
          - data.qmd
          - glossary.qmd
          - accessibility.qmd

format:
  html:
    # Plain Bootstrap with our own variables, rather than a Bootswatch theme:
    # Quarto's chrome (sidebar, table of contents, search, callouts, code
    # highlighting) still rests on Bootstrap, which several accessibility tests
    # already assume, but one less set of borrowed opinions fights the design
    # layer. Not `theme: none` -- rebuilding Quarto's chrome is a large surface
    # to get subtly wrong.
    theme:
      light: theme-light.scss
      dark: theme-dark.scss
    # styles.css first: it declares the --cwai-* colour tokens and the reflow
    # safety net. tailwind.css is generated from site/_tailwind/ by
    # scripts/build_tailwind.py and must load after, so the design layer wins.
    # Neither is fetched from a CDN; both are served from this site.
    css:
      - styles.css
      - tailwind.css
    toc: true
    toc-depth: 3
    code-copy: true
    smooth-scroll: false
