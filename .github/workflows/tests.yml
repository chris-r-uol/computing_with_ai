name: tests

on:
  push:
    branches: [main, foundation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev --group core
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      # --allow-missing: the real STATS19, AADF and OSM files are not vendored yet,
      # so their absence is tolerated. Remove the flag once they are built.
      # Every other check (unclaimed files, licences, size budget) stays live.
      - run: uv run python scripts/check_licences.py --allow-missing
