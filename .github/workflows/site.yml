name: site

# Publishes the Quarto site to GitHub Pages. The site is only built and deployed
# if the tests and the notebook run pass in this same workflow, so a failing
# notebook blocks publication. (A `workflow_run` trigger on tests.yml would only
# fire from the default branch's copy of that file and would run on failures too.)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel a deploy half way; a newer one simply queues behind it.
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # CWAI_PUBLISH_GATE turns on the "no TODO left in the accessibility
      # statement" test, so the site cannot deploy while it is unfinished.
      - run: uv run pytest
        env:
          CWAI_PUBLISH_GATE: "1"
      - run: uv run python scripts/build_student_notebooks.py --check
      - run: uv run python scripts/run_notebooks.py notebooks/

  build:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      # Renders student/ (solutions stubbed) and generates the data page from the
      # registry. A notebook that errors fails the render, so it is never published.
      - run: uv run python scripts/render_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
