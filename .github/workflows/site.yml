name: site

# Publishes the Quarto site to GitHub Pages. The site is only built and deployed
# if the tests and the notebook run pass in this same workflow, so a failing
# notebook blocks publication. (A `workflow_run` trigger on tests.yml would only
# fire from the default branch's copy of that file and would run on failures too.)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel a deploy half way; a newer one simply queues behind it.
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    # The same check list the tests workflow runs, plus the publication-only
    # checks and the notebook run; see .github/workflows/checks.yml.
    uses: ./.github/workflows/checks.yml
    with:
      groups: "--all-groups"
      publish-gate: true
      run-notebooks: true

  build:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      # Renders student/ (solutions stubbed) and generates the data page from the
      # registry. A notebook that errors fails the render, so it is never published.
      - run: uv run python scripts/render_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
