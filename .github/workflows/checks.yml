name: checks

# The one list of checks, called by both tests.yml and site.yml's gate. It used
# to be written out in each of them, and the copies had already drifted: the
# publish path ran every check except the licence audit, so a direct push to
# main could publish the registry-generated data page having never audited the
# data. Add a check here and every path that publishes or merges gets it.
on:
  workflow_call:
    inputs:
      groups:
        description: "Dependency groups to install, as uv sync flags."
        type: string
        default: "--group dev --group core"
      publish-gate:
        description: >-
          Turn on the checks that only a publication must pass, such as "no TODO
          is left in the accessibility statement".
        type: boolean
        default: false
      run-notebooks:
        description: "Also execute every notebook in a fresh kernel."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # --locked: fail rather than silently re-resolve, so a pyproject.toml
      # edit without a matching `uv lock` cannot install versions nobody has
      # recorded.
      - run: uv sync --locked ${{ inputs.groups }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # actionlint is a dev dependency; it checks these workflow files.
      - run: uv run actionlint .github/workflows/*.yml
      # CWAI_PUBLISH_GATE turns on the two "no TODO is left" tests, one for the
      # accessibility statement and one for the rest of the student-facing
      # content, so the site cannot deploy while a placeholder remains in it.
      - run: uv run pytest
        env:
          CWAI_PUBLISH_GATE: ${{ inputs.publish-gate && '1' || '' }}
      # Student notebooks are generated from the full ones; fail if they have drifted.
      - run: uv run python scripts/build_student_notebooks.py --check
      # site/tailwind.css is generated from site/_tailwind/ and committed, so
      # that no student's browser has to fetch Tailwind from a CDN. Rebuild it
      # here and fail if the committed copy differs. This downloads the pinned
      # standalone Tailwind binary from the GitHub release named in
      # scripts/build_tailwind.py.
      - run: uv run python scripts/build_tailwind.py --check
      # site/vendor/ holds the two scripts Quarto would load from a CDN. Fail if
      # either differs from the version and hash pinned in the script, or has
      # lost its licence banner or its entry in site/vendor/NOTICE.txt.
      - run: uv run python scripts/selfhost_assets.py --check
      - run: uv run python scripts/check_licences.py
      # site/data.qmd is generated from the registry at render time and is not
      # committed, so it must exist before the prose gate can read it.
      - run: uv run python scripts/render_site.py --write-data-page
      # The prose gate (design §7.8): plain English in everything a student
      # reads. Every student-facing surface is listed here, because the gate
      # checks what it is given, and a path it cannot read is now a failure
      # rather than a silent pass. site/accessibility.qmd and site/glossary.qmd
      # are exempt, with the reason, in the script itself.
      #
      # Three notes on the list. site/data.qmd is generated and not committed,
      # so the step above writes it: the gate reads the assembled page, which
      # is the only place its sentences are measured together, as well as the
      # two modules that write them. A Python module is named rather than swept
      # from a directory: `site/` would pull in the render-time site/notebooks/
      # copies, and `src/cwai/` would pull in modules holding no student prose.
      # And scripts/build_student_notebooks.py is here because it owns the
      # strings it writes into every stripped notebook a student opens, so its
      # wording reaches students even though the file never does.
      #
      # test_every_authored_page_is_either_gated_or_exempt holds the site half
      # of the guarantee in the comment above: a new page that is neither in
      # this list nor exempt fails the suite. The modules are still chosen by
      # hand, so a new one that speaks to a student must be added here.
      - run: >-
          uv run python scripts/check_prose.py
          site/index.qmd site/data.qmd site/_stages
          scripts/render_site.py scripts/build_student_notebooks.py
          src/cwai/registry.py
          src/cwai/checks.py src/cwai/slices.py src/cwai/data.py
          src/cwai/hints.py hints notebooks
      - if: inputs.run-notebooks
        run: uv run python scripts/run_notebooks.py notebooks/
