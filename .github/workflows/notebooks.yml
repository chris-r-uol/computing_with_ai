name: notebooks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC. Catches dependencies drifting under untouched material.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # --locked: the pinned run must install exactly what uv.lock records.
      - run: uv sync --locked --all-groups
      - run: uv run python scripts/run_notebooks.py notebooks/

  # The job above installs uv.lock, so on a schedule it reinstalls identical
  # pins forever and can never see drift. This one re-resolves from
  # pyproject.toml into a throwaway lock, which is the only way a release
  # published upstream reaches the notebooks before a student meets it.
  #
  # It is a separate job, so a red run names which half broke, and it *does*
  # fail the run. A failed run is the only thing GitHub pushes to anybody, so
  # suppressing it would leave this job detecting drift and then reporting
  # success -- the same defect as the pinned run that could not detect it at
  # all. It triggers only on a schedule or by hand, so it cannot redden a pull
  # request or a push. The "versions that moved" step says what changed.
  fresh-resolve:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # The rewritten uv.lock lives and dies with this runner; nothing is pushed.
      - run: uv lock --upgrade
      - name: versions that moved
        run: git --no-pager diff --stat -- uv.lock
      - run: uv sync --all-groups
      - run: uv run python scripts/run_notebooks.py notebooks/
