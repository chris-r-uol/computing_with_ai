name: notebooks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC. Catches dependencies drifting under untouched material.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # --locked: the pinned run must install exactly what uv.lock records.
      - run: uv sync --locked --all-groups
      - run: uv run python scripts/run_notebooks.py notebooks/

  # The job above installs uv.lock, so on a schedule it reinstalls identical
  # pins forever and can never see drift. This one re-resolves from
  # pyproject.toml into a throwaway lock, which is the only way a release
  # published upstream reaches the notebooks before a student meets it.
  #
  # It reports separately and does not fail the workflow: a broken upstream
  # release is news, not a reason to redden a branch nobody has touched. Read
  # it on the Actions tab; the "versions that moved" step says what changed.
  fresh-resolve:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # The rewritten uv.lock lives and dies with this runner; nothing is pushed.
      - run: uv lock --upgrade
      - name: versions that moved
        run: git --no-pager diff --stat -- uv.lock
      - run: uv sync --all-groups
      - run: uv run python scripts/run_notebooks.py notebooks/
