name: notebooks

on:
  push:
    branches: [main, foundation]
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC. Catches dependencies drifting under untouched material.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run python scripts/run_notebooks.py notebooks/
