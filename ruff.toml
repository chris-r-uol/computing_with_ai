line-length = 88
target-version = "py312"
# Deliberately broken notebooks that the harness tests execute.
extend-exclude = ["tests/fixtures"]

[lint]
select = ["E", "F", "I", "B", "UP"]

[format]
# Not a no-op: ruff formats the Python code blocks inside Markdown files too,
# and the plan and design documents under docs/ quote illustrative snippets
# that are not ours to reflow. Drop this line and `ruff format --check .`
# fails on docs/superpowers/plans/.
exclude = ["*.md"]
